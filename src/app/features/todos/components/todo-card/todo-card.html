<div class="todo-card" [class.todo-card--completed]="todo.status === TodoStatus.COMPLETED" [class.todo-card--overdue]="isOverdue">
  <!-- Card Header / Meta -->
  <div class="todo-card__header">
    <div class="todo-card__checkbox-wrap">
      <input type="checkbox"
             class="todo-card__checkbox"
             [checked]="todo.status === TodoStatus.COMPLETED"
             (change)="toggleCompleted($event)"
             [id]="'check-todo-' + todo.id"
             aria-label="Toggle task completion" />
      <app-badge variant="priority" [value]="todo.priority" />
    </div>

    <div class="todo-card__actions">
      <select class="todo-card__status-select" [value]="todo.status" (change)="onStatusSelect($event)" [id]="'select-status-' + todo.id">
        <option [value]="TodoStatus.TODO">To Do</option>
        <option [value]="TodoStatus.IN_PROGRESS">In Progress</option>
        <option [value]="TodoStatus.COMPLETED">Completed</option>
        <option [value]="TodoStatus.ARCHIVED">Archived</option>
      </select>

      <button class="todo-card__action-btn" (click)="edit.emit(todo)" aria-label="Edit task" [id]="'btn-edit-' + todo.id">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </button>

      <button class="todo-card__action-btn todo-card__action-btn--delete" (click)="promptDelete()" aria-label="Delete task" [id]="'btn-delete-' + todo.id">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Content -->
  <div class="todo-card__body">
    <h3 class="todo-card__title" [title]="todo.title">{{ todo.title }}</h3>
    @if (todo.description) {
      <p class="todo-card__desc" [title]="todo.description">{{ todo.description }}</p>
    } @else {
      <p class="todo-card__desc todo-card__desc--empty">No description provided</p>
    }
  </div>

  <!-- Card Footer -->
  <div class="todo-card__footer">
    <app-badge variant="category" [value]="todo.category" />
    <span class="todo-card__due" [class.todo-card__due--overdue]="isOverdue">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      {{ formatDate(todo.dueDate) }}
    </span>
  </div>
</div>

@if (showConfirm()) {
  <app-confirm-dialog
    message="Are you sure you want to delete this task? This action cannot be undone."
    (confirmed)="confirmDelete()"
    (cancelled)="cancelDelete()" />
}
