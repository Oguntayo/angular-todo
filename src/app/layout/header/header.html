<header class="header" role="banner">
  <!-- Left: hamburger toggle + wordmark -->
  <div class="header__left">
    <button class="header__menu-btn" id="btn-mobile-menu" (click)="toggleSidebar.emit()" aria-label="Toggle navigation menu">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <div class="header__wordmark">
      <span class="header__org">Acme</span>
      <span class="header__separator">/</span>
      <span class="header__app">TaskFlow</span>
    </div>
  </div>

  <!-- Centre: global search -->
  <div class="header__search">
    <div class="header__search-wrap" role="search">
      <svg class="header__search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="global-search" class="header__search-input" type="search"
             placeholder="Search tasks…" aria-label="Global search" />
      <kbd class="header__kbd">⌘K</kbd>
    </div>
  </div>

  <!-- Right: actions -->
  <div class="header__right">
    <!-- Notifications -->
    <button class="header__icon-btn" id="btn-notifications" aria-label="Notifications"
            [class.header__icon-btn--alert]="overdueCount > 0">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      @if (overdueCount > 0) {
        <span class="header__notif-dot" aria-label="{{ overdueCount }} overdue tasks">
          {{ overdueCount }}
        </span>
      }
    </button>

    <!-- Help -->
    <button class="header__icon-btn header__help-btn" id="btn-help" aria-label="Help">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </button>

    <div class="header__divider" aria-hidden="true"></div>

    <!-- User avatar -->
    <button class="header__avatar" id="btn-user-menu" aria-label="User menu">
      <span class="header__avatar-text">JD</span>
    </button>
  </div>
</header>
